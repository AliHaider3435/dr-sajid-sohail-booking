# Workspace configuration
packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

# Dependency catalogs
catalog:
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.101.4
  '@types/node': ^25.9.5
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.42.2
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.1
  vite: ^7.3.6
  wouter: ^3.10.0
  zod: ^3.25.76

# Install peer dependencies automatically where required
autoInstallPeers: false

# Only packages that are explicitly allowed to run install/build scripts
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Keep the dependency installation secure.
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
