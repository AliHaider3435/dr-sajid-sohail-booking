kind = "web"
previewPath = "/"
title = "Dr. Iqbal Kharal — Neurosurgeon"
description = "A professional patient-facing website for Dr. Iqbal Kharal, neurosurgeon at Neuro Tower Multan, with clinic information, services, reviews, and an appointment booking request flow."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
