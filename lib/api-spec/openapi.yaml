openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment booking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointment requests
      description: Returns recent appointment requests for the clinic
      responses:
        "200":
          description: Appointment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Request an appointment
      description: Creates a patient appointment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid appointment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /appointments/availability:
    get:
      operationId: getAppointmentAvailability
      tags: [appointments]
      summary: Get appointment availability
      description: Returns the clinic schedule and available visit types
      responses:
        "200":
          description: Appointment availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Appointment:
      type: object
      properties:
        id:
          type: number
        clinicLocation:
          type: string
          enum: [multan, layyah, dg-khan]
        city:
          type: string
        patientName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        appointmentType:
          type: string
          enum: [new-patient, follow-up, emergency-consultation]
        preferredDate:
          type: string
        preferredTime:
          type: string
        message:
          type: ["string", "null"]
        attachmentName:
          type: ["string", "null"]
        status:
          type: string
          enum: [requested, confirmed, cancelled]
        createdAt:
          type: string
      required:
        - id
        - clinicLocation
        - city
        - patientName
        - phone
        - email
        - appointmentType
        - preferredDate
        - preferredTime
        - message
        - attachmentName
        - status
        - createdAt
    AppointmentInput:
      type: object
      properties:
        clinicLocation:
          type: string
          enum: [multan, layyah, dg-khan]
        city:
          type: string
          minLength: 2
        patientName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 7
        email:
          type: ["string", "null"]
        appointmentType:
          type: string
          enum: [new-patient, follow-up, emergency-consultation]
        preferredDate:
          type: string
        preferredTime:
          type: string
        message:
          type: ["string", "null"]
        attachmentName:
          type: ["string", "null"]
      required:
        - clinicLocation
        - city
        - patientName
        - phone
        - email
        - appointmentType
        - preferredDate
        - preferredTime
        - message
        - attachmentName
    Availability:
      type: object
      properties:
        phone:
          type: string
        emergencyPhone:
          type: string
        whatsappMessage:
          type: array
          items:
            type: string
        clinics:
          type: array
          items:
            $ref: "#/components/schemas/ClinicLocation"
        appointmentTypes:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentType"
      required:
        - phone
        - emergencyPhone
        - whatsappMessage
        - clinics
        - appointmentTypes
    ClinicLocation:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
        name:
          type: string
        city:
          type: string
        address:
          type: string
        mapsUrl:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ClinicSchedule"
        slots:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - city
        - address
        - mapsUrl
        - schedule
        - slots
    ClinicSchedule:
      type: object
      properties:
        days:
          type: string
        hours:
          type: string
        note:
          type: ["string", "null"]
      required:
        - days
        - hours
        - note
    AppointmentType:
      type: object
      properties:
        value:
          type: string
          enum: [new-patient, follow-up, emergency-consultation]
        label:
          type: string
        description:
          type: string
      required:
        - value
        - label
        - description
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

